name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # git-хуки в CI не потрібні

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # lock-файли створені npm 12, тому ставимо ту саму версію
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install NPM packages
        run: |
          npm ci
          npm ci --prefix client

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (TypeScript -> JavaScript)
        run: npm run build