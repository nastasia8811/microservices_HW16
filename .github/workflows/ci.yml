name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HUSKY: 0
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/news_test
      JWT_SECRET: ci-test-secret
      PORT: 3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # lock-файли створені npm 12, тому ставимо ту саму версію
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install NPM packages
        run: |
          npm ci
          npm ci --prefix client

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (with tests)
        run: npm run typecheck

      - name: Test (jest)
        run: npm test

      - name: Build (TypeScript -> JavaScript)
        run: npm run build
